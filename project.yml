# Generate the Xcode project with:  xcodegen generate
name: ReelRecipes

options:
  bundleIdPrefix: com.berdem45
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Set your Apple Developer Team ID here (or pick it in Xcode → Signing & Capabilities).
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  ReelRecipes:
    type: application
    platform: iOS
    sources:
      - path: ReelRecipes
      - path: Shared
    info:
      path: ReelRecipes/Info.plist
      properties:
        CFBundleDisplayName: Reel Recipes
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    entitlements:
      path: ReelRecipes/ReelRecipes.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.berdem45.reelrecipes
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.berdem45.ReelRecipes
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: ReelRecipesShare
    scheme:
      testTargets:
        - ReelRecipesTests

  ReelRecipesShare:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
      - path: Shared
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Reel Recipes
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    entitlements:
      path: ShareExtension/ReelRecipesShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.berdem45.reelrecipes
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.berdem45.ReelRecipes.Share
        TARGETED_DEVICE_FAMILY: "1"

  ReelRecipesTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ReelRecipesTests
    dependencies:
      - target: ReelRecipes
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.berdem45.ReelRecipesTests
